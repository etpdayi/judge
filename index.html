<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mahkeme Salonu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { slab: ['Bevan', 'serif'], sans: ['Figtree', 'system-ui', 'sans-serif'] },
      colors: { walnut: '#2b1a12', brass: '#c9a24b', felt: '#1f5a3a', oxblood: '#8c1f2b', paper: '#efe5cf', ink: '#1c120d' }
    } } }
  </script>
  <style>
    body { margin: 0; color: #efe5cf; }
    .wood { background: repeating-linear-gradient(90deg, #2b1a12 0 14px, #2f1d14 14px 15px, #2b1a12 15px 41px, #35221a 41px 42px); }
    .bench-judge { background: linear-gradient(#4a2c1b, #33201a); border: 3px solid #c9a24b; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(-70vh) scale(1.4); opacity: 0 } }
    .float-up { animation: floatUp 3s ease-out forwards; }
    @keyframes slam { 0% { transform: rotate(-70deg) scale(2); opacity: 0 } 35% { opacity: 1 } 55% { transform: rotate(8deg) scale(1) } 70% { transform: rotate(-4deg) } 100% { transform: rotate(0) } }
    .slam { animation: slam .9s ease-out both; display: inline-block; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
    .confetti { position: fixed; top: -20px; width: 10px; height: 16px; animation: fall linear forwards; }
    @keyframes pop { 0% { transform: scale(.5); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
    .pop { animation: pop .25s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .float-up, .slam, .pop, .confetti { animation-duration: .01s; } }
  </style>
</head>
<body>
  <div id="root"><p style="padding:24px;font-family:sans-serif">Mahkeme Salonu yükleniyor…</p></div>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="host.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
